name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Localizar projeto
        id: proj
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            find . -name "*.zip" -not -path "./.git/*" | while read -r Z; do
              echo "Extraindo $Z"
              unzip -oq "$Z" -d ./_extraido
            done
            FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle.kts não encontrado. Envie os arquivos do ZIP para o repositório."
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Projeto encontrado em: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAim-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
